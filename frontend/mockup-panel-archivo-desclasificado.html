<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archivo Desclasificado — Panel</title>
<style>
  :root{
    --ink-bg:#12151f;
    --ink-panel:#1a1e2a;
    --ink-panel-2:#212636;
    --ink-border:#2b3142;
    --paper:#e9e2cf;
    --paper-2:#ddd3b8;
    --paper-ink:#2b2416;
    --paper-ink-soft:#6b6248;
    --text:#e9e6dd;
    --text-muted:#8b91a3;
    --accent:#c98a2e;
    --accent-soft:rgba(201,138,46,.16);
    --approved:#5a8a6a;
    --approved-soft:rgba(90,138,106,.16);
    --pending:#b6432f;
    --pending-soft:rgba(182,67,47,.14);
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink-bg);
    color:var(--text);
    font-family:var(--font-ui);
    min-height:100vh;
  }
  a{color:inherit;}
  button{font-family:inherit;}
  button:focus-visible, a:focus-visible{
    outline:2px solid var(--accent);
    outline-offset:2px;
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important; animation:none !important;}
  }

  .app{
    display:grid;
    grid-template-columns:220px 1fr;
    min-height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--ink-panel);
    border-right:1px solid var(--ink-border);
    padding:22px 16px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 4px;
  }
  .brand-mark{
    width:30px;height:30px;
    border:1px solid var(--accent);
    border-radius:4px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:12px;
    color:var(--accent);
    letter-spacing:.02em;
    flex:none;
  }
  .brand-name{
    font-size:14px;
    font-weight:600;
    line-height:1.2;
    color:var(--text);
  }
  .brand-name span{
    display:block;
    font-size:11px;
    font-weight:400;
    color:var(--text-muted);
  }
  nav.primary-nav{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 10px;
    border-radius:7px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:13.5px;
    cursor:pointer;
  }
  .nav-item svg{flex:none;opacity:.8;}
  .nav-item:hover{background:var(--ink-panel-2);color:var(--text);}
  .nav-item.active{
    background:var(--accent-soft);
    color:var(--accent);
  }
  .nav-item.active svg{opacity:1;}
  .sidebar-foot{
    margin-top:auto;
    display:flex;
    align-items:center;
    gap:9px;
    padding:10px;
    border-top:1px solid var(--ink-border);
  }
  .avatar{
    width:26px;height:26px;border-radius:50%;
    background:var(--ink-panel-2);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--text-muted);
    flex:none;
  }
  .sidebar-foot .who{font-size:12.5px;color:var(--text-muted);}

  /* ---------- Main ---------- */
  main{padding:28px 34px 60px;max-width:900px;}
  .topbar{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:20px;
    margin-bottom:26px;
    flex-wrap:wrap;
  }
  .topbar h1{
    margin:0 0 4px;
    font-size:22px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  .topbar p{
    margin:0;
    font-size:13.5px;
    color:var(--text-muted);
  }
  .run-cluster{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .status-pill{
    font-size:12.5px;
    color:var(--text-muted);
    padding:6px 12px;
    border:1px solid var(--ink-border);
    border-radius:20px;
    background:var(--ink-panel);
    white-space:nowrap;
  }
  .status-pill.working{color:var(--accent);border-color:var(--accent);}
  .status-pill.done{color:var(--approved);border-color:var(--approved);}
  .btn-run{
    background:var(--accent);
    color:#1a1305;
    border:none;
    padding:10px 18px;
    border-radius:8px;
    font-size:14px;
    font-weight:600;
    display:flex;align-items:center;gap:8px;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn-run:hover{filter:brightness(1.08);}
  .btn-run:disabled{opacity:.55;cursor:progress;}
  .btn-run svg{flex:none;}

  /* ---------- Bulk action bar ---------- */
  .bulk-bar{
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
    background:var(--ink-panel-2);
    border:1px solid var(--ink-border);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:18px;
    position:sticky;
    top:12px;
    z-index:5;
  }
  .bulk-count{
    font-size:13px;
    color:var(--text-muted);
    margin-right:auto;
    font-weight:600;
  }
  .bulk-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .bulk-clear{
    background:none;border:none;
    color:var(--text-muted);
    font-size:12.5px;
    text-decoration:underline;
    cursor:pointer;
    padding:4px;
  }
  .bulk-clear:hover{color:var(--text);}

  /* ---------- Feed ---------- */
  .feed{display:flex;flex-direction:column;gap:20px;}

  .case-card{
    background:var(--ink-panel);
    border:1px solid var(--ink-border);
    border-radius:10px;
    overflow:hidden;
  }
  .case-card.new{animation:reveal .5s ease both;}
  @keyframes reveal{
    from{opacity:0;transform:translateY(-6px);}
    to{opacity:1;transform:translateY(0);}
  }

  .doc-face{
    background:var(--paper);
    color:var(--paper-ink);
    padding:18px 20px 16px;
    position:relative;
  }
  .doc-face::after{
    content:"";
    position:absolute;left:0;right:0;bottom:0;
    height:6px;
    background:linear-gradient(var(--paper-2), transparent);
    opacity:.6;
  }
  .doc-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:14px;
  }
  .doc-title-block h3{
    margin:0 0 6px;
    font-size:16.5px;
    font-weight:700;
    line-height:1.3;
  }
  .doc-hook{
    margin:0;
    font-size:13.5px;
    color:var(--paper-ink-soft);
    line-height:1.5;
    max-width:52ch;
  }
  .stamp{
    font-family:var(--font-mono);
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.09em;
    text-transform:uppercase;
    padding:5px 9px;
    border:1.5px solid currentColor;
    border-radius:4px;
    transform:rotate(-2deg);
    flex:none;
    white-space:nowrap;
  }
  .stamp.pending{color:var(--pending);}
  .stamp.approved{color:var(--approved);}

  .doc-meta{
    margin-top:14px;
    display:flex;
    flex-wrap:wrap;
    gap:5px 16px;
    font-family:var(--font-mono);
    font-size:11.5px;
    color:var(--paper-ink-soft);
  }
  .doc-meta b{color:var(--paper-ink);font-weight:600;}

  .actions{
    display:flex;
    align-items:center;
    gap:10px;
    padding:14px 20px;
    border-bottom:1px solid var(--ink-border);
    flex-wrap:wrap;
  }
  .btn{
    font-size:13px;
    padding:8px 14px;
    border-radius:7px;
    border:1px solid var(--ink-border);
    background:transparent;
    color:var(--text);
    cursor:pointer;
    display:flex;align-items:center;gap:7px;
  }
  .btn:hover{background:var(--ink-panel-2);}
  .btn-approve{
    background:var(--accent);
    border-color:var(--accent);
    color:#1a1305;
    font-weight:600;
    margin-left:auto;
  }
  .btn-approve:hover{filter:brightness(1.08);}
  .approved-tag{
    margin-left:auto;
    display:flex;align-items:center;gap:7px;
    font-size:12.5px;
    color:var(--approved);
    font-weight:600;
  }

  .preview{
    display:none;
    padding:16px 20px;
    border-bottom:1px solid var(--ink-border);
    background:var(--ink-panel-2);
  }
  .preview.open{display:block;}
  .preview h4{
    margin:0 0 8px;
    font-size:11.5px;
    color:var(--text-muted);
    font-weight:600;
  }
  .preview-script{
    font-size:13.5px;
    line-height:1.6;
    color:var(--text);
    margin:0 0 12px;
    max-width:64ch;
  }
  .preview-tag{
    display:inline-flex;
    font-family:var(--font-mono);
    font-size:11px;
    color:var(--text-muted);
    background:var(--ink-panel);
    border:1px solid var(--ink-border);
    padding:3px 8px;
    border-radius:5px;
    margin-right:6px;
  }

  .select-toggle{
    display:flex;align-items:center;gap:7px;
    font-size:13px;
    color:var(--text);
    cursor:pointer;
    user-select:none;
  }
  .select-toggle input{
    width:15px;height:15px;
    accent-color:var(--accent);
    cursor:pointer;
  }
  .select-toggle.disabled{
    color:var(--text-muted);
    cursor:not-allowed;
  }
  .select-toggle.disabled input{cursor:not-allowed;}

  .net-status-row{
    padding:13px 20px 17px;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .net-status-row .hint{
    font-size:12px;
    color:var(--text-muted);
    display:flex;align-items:center;gap:6px;
  }
  .net-status{display:flex;gap:7px;align-items:center;}
  .net-chip{
    position:relative;
    opacity:.4;
  }
  .net-chip.done{opacity:1;}
  .net-chip .mono{
    width:20px;height:20px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:9px;
    color:#fff;
    flex:none;
  }
  .net-chip.done .mono{box-shadow:0 0 0 2px var(--approved);}
  .net-chip.done::after{
    content:"";
    position:absolute;top:-3px;right:-3px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--approved);
    border:1.5px solid var(--ink-panel);
  }

  .net-btn{
    display:flex;align-items:center;gap:8px;
    padding:8px 13px;
    border-radius:7px;
    border:1px solid var(--ink-border);
    background:var(--ink-panel-2);
    color:var(--text);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .net-btn .mono{
    width:20px;height:20px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--font-mono);
    font-size:9.5px;
    color:#fff;
    flex:none;
  }
  .net-btn:hover:not(:disabled){filter:brightness(1.12);}
  .net-btn:disabled{
    opacity:.4;
    cursor:not-allowed;
  }
  .net-btn.published{
    background:var(--approved-soft);
    border-color:var(--approved);
    color:var(--approved);
  }
  .net-btn.published .mono{background:var(--approved) !important;}

  @media (max-width: 720px){
    .app{grid-template-columns:64px 1fr;}
    .brand-name, .nav-item span, .sidebar-foot .who{display:none;}
    .sidebar{padding:22px 10px;align-items:center;}
    .nav-item{justify-content:center;}
    main{padding:22px 16px 60px;}
    .topbar{align-items:flex-start;}
  }
</style>
</head>
<body>

<div class="app">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">AD</div>
      <div class="brand-name">Archivo<span>Desclasificado</span></div>
    </div>
    <nav class="primary-nav">
      <a class="nav-item active">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
        <span>Pipeline</span>
      </a>
      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Calendario</span>
      </a>
      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19V6a2 2 0 0 1 2-2h6l2 2h6v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2Z"/></svg>
        <span>Casos cubiertos</span>
      </a>
      <a class="nav-item">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.03.03a2 2 0 1 1-2.83 2.83l-.03-.03a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V19a2 2 0 1 1-4 0v-.06a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.03.03a2 2 0 1 1-2.83-2.83l.03-.03a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.06A1.65 1.65 0 0 0 4.57 8.6a1.65 1.65 0 0 0-.33-1.82l-.03-.03a2 2 0 1 1 2.83-2.83l.03.03a1.65 1.65 0 0 0 1.82.33h.06A1.65 1.65 0 0 0 10 3.06V3a2 2 0 1 1 4 0v.06a1.65 1.65 0 0 0 1 1.51h.06a1.65 1.65 0 0 0 1.82-.33l.03-.03a2 2 0 1 1 2.83 2.83l-.03.03a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.06a1.65 1.65 0 0 0-1.54 1Z"/></svg>
        <span>Configuración</span>
      </a>
    </nav>
    <div class="sidebar-foot">
      <div class="avatar">👤</div>
      <div class="who">Editorial</div>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div>
        <h1>Pipeline de contenido</h1>
        <p>Revisa lo que encontró el sistema, aprueba y publica.</p>
      </div>
      <div class="run-cluster">
        <span class="status-pill" id="statusPill">Inactivo</span>
        <button class="btn-run" id="runBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8V4z"/></svg>
          Ejecutar pipeline
        </button>
      </div>
    </div>

    <div class="bulk-bar" id="bulkBar">
      <span class="bulk-count" id="bulkCount">Selecciona casos aprobados para publicar en lote</span>
      <div class="bulk-actions" id="bulkActions"></div>
      <button class="bulk-clear" id="bulkClear">Limpiar selección</button>
    </div>

    <div class="feed" id="feed"></div>
  </main>

</div>

<script>
const NETWORKS = [
  { key:'tiktok',    label:'TikTok',    mono:'TT', bg:'#14151a' },
  { key:'instagram',  label:'Instagram', mono:'IG', bg:'linear-gradient(135deg,#8b3aa8,#e2632c)' },
  { key:'facebook',  label:'Facebook',  mono:'FB', bg:'#1a5fb4' },
  { key:'x',         label:'X',         mono:'X',  bg:'#14151a' },
];

let CASES = [
  {
    id:'c1', new:false, approved:false, selected:false, previewOpen:false,
    title:'El apagón de misiles de Malmstrom',
    hook:'Diez misiles nucleares se desactivaron solos justo cuando un objeto luminoso apareció sobre la base.',
    agency:'Fuerza Aérea de EE. UU. — war.gov/UFO', docType:'Informe desclasificado', docDate:'16 mar 1967', caseNo:'DOW-1967-0341',
    chapters:2,
    previewText:'“A las 9:00 de la mañana, los operadores del silo reportaron una luz roja estacionaria sobre el perímetro. Segundos después, los diez misiles del vuelo pasaron a estado de no-lanzable, uno tras otro, sin ninguna orden registrada.”',
    tags:['#ovni','#desclasificado','#historiareal'],
    networks:{tiktok:false, instagram:false, facebook:false, x:false}
  },
  {
    id:'c2', new:false, approved:true, selected:false, previewOpen:false,
    title:'El cable del Departamento de Estado sobre Teherán',
    hook:'Dos cazas F-4 perdieron el control de sus instrumentos al acercarse al objeto.',
    agency:'Departamento de Estado — war.gov/UFO', docType:'Cable diplomático', docDate:'19 sep 1976', caseNo:'DOS-1976-0219',
    chapters:1,
    previewText:'“El piloto reportó pérdida total de instrumentación de armamento a 40 km del objeto. Al alejarse, los sistemas volvieron a funcionar con normalidad.”',
    tags:['#fani','#fuerzasarmadas','#misterio'],
    networks:{tiktok:true, instagram:false, facebook:false, x:false}
  },
  {
    id:'c3', new:false, approved:true, selected:false, previewOpen:false,
    title:'El expediente de radar del golfo de México',
    hook:'El objeto igualó la velocidad del buque durante once minutos antes de desaparecer del radar.',
    agency:'Marina de EE. UU. — The Black Vault', docType:'Registro de radar + testimonio', docDate:'02 jul 1994', caseNo:'BV-1994-1102',
    chapters:3,
    previewText:'“El contacto se mantuvo a 300 metros de babor, replicando cada cambio de rumbo. No hubo respuesta por radio ni identificación visual confirmada.”',
    tags:['#marina','#radar','#parte1'],
    networks:{tiktok:true, instagram:true, facebook:true, x:true}
  },
];

function iconLock(){
  return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
}
function iconCheck(){
  return '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M5 12l4 4 10-10"/></svg>';
}
function iconEye(){
  return '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
}

function render(){
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  CASES.forEach(c => feed.appendChild(renderCard(c)));
  updateBulkBar();
}

function renderCard(c){
  const card = document.createElement('div');
  card.className = 'case-card' + (c.new ? ' new' : '');

  const stamp = c.approved
    ? `<span class="stamp approved">Aprobado</span>`
    : `<span class="stamp pending">Pendiente</span>`;

  card.innerHTML = `
    <div class="doc-face">
      <div class="doc-top">
        <div class="doc-title-block">
          <h3>${c.title}</h3>
          <p class="doc-hook">${c.hook}</p>
        </div>
        ${stamp}
      </div>
      <div class="doc-meta">
        <span><b>Procedencia:</b> ${c.agency}</span>
        <span><b>Tipo:</b> ${c.docType}</span>
        <span><b>Fecha del documento:</b> ${c.docDate}</span>
        <span><b>Ref.:</b> ${c.caseNo}</span>
        <span><b>Capítulos:</b> ${c.chapters}</span>
      </div>
    </div>

    <div class="actions">
      <label class="select-toggle${c.approved ? '' : ' disabled'}" title="${c.approved ? 'Incluir en publicación por lotes' : 'Aprueba el caso para poder seleccionarlo'}">
        <input type="checkbox" ${c.approved ? '' : 'disabled'} ${c.selected ? 'checked' : ''}>
        <span>Seleccionar</span>
      </label>
      <button class="btn btn-preview">${iconEye()} ${c.previewOpen ? 'Ocultar guion' : 'Vista previa'}</button>
      ${c.approved
        ? `<span class="approved-tag">${iconCheck()} Aprobado</span>`
        : `<button class="btn btn-approve">Aprobar</button>`}
    </div>

    <div class="preview${c.previewOpen ? ' open' : ''}">
      <h4>Guion — capítulo 1</h4>
      <p class="preview-script">${c.previewText}</p>
      <div>${c.tags.map(t => `<span class="preview-tag">${t}</span>`).join('')}</div>
    </div>

    <div class="net-status-row">
      ${c.approved
        ? `<div class="net-status">${NETWORKS.map(net => `
            <span class="net-chip${c.networks[net.key] ? ' done' : ''}" title="${net.label}${c.networks[net.key] ? ' — publicado' : ' — sin publicar'}">
              <span class="mono" style="background:${net.bg}">${net.mono}</span>
            </span>`).join('')}</div>
           <span class="hint">selecciona el caso y publica desde la barra de arriba</span>`
        : `<span class="hint">${iconLock()} la publicación se habilita al aprobar</span>`}
    </div>
  `;

  // checkbox select
  const checkbox = card.querySelector('.select-toggle input');
  checkbox.addEventListener('change', () => {
    c.selected = checkbox.checked;
    updateBulkBar();
  });

  // preview toggle
  const previewEl = card.querySelector('.preview');
  const previewBtn = card.querySelector('.btn-preview');
  previewBtn.addEventListener('click', () => {
    c.previewOpen = !c.previewOpen;
    previewEl.classList.toggle('open', c.previewOpen);
    previewBtn.innerHTML = `${iconEye()} ${c.previewOpen ? 'Ocultar guion' : 'Vista previa'}`;
  });

  // approve
  const approveBtn = card.querySelector('.btn-approve');
  if (approveBtn){
    approveBtn.addEventListener('click', () => {
      c.approved = true;
      render();
    });
  }

  return card;
}

function updateBulkBar(){
  const selectedCases = CASES.filter(c => c.approved && c.selected);
  const bulkCount = document.getElementById('bulkCount');
  const bulkActions = document.getElementById('bulkActions');
  const bulkClear = document.getElementById('bulkClear');

  bulkCount.textContent = selectedCases.length === 0
    ? 'Selecciona casos aprobados para publicar en lote'
    : selectedCases.length + (selectedCases.length === 1 ? ' caso seleccionado' : ' casos seleccionados');
  bulkCount.style.color = selectedCases.length === 0 ? 'var(--text-muted)' : 'var(--accent)';
  bulkClear.style.visibility = selectedCases.length === 0 ? 'hidden' : 'visible';

  bulkActions.innerHTML = '';
  NETWORKS.forEach(net => {
    const allDone = selectedCases.length > 0 && selectedCases.every(c => c.networks[net.key]);
    const btn = document.createElement('button');
    btn.className = 'net-btn';
    btn.disabled = selectedCases.length === 0 || allDone;
    btn.innerHTML = `<span class="mono" style="background:${net.bg}">${net.mono}</span>
      ${allDone ? iconCheck() + ' Ya publicado' : 'Publicar en ' + net.label}`;
    btn.addEventListener('click', () => {
      selectedCases.forEach(c => { c.networks[net.key] = true; });
      render();
    });
    bulkActions.appendChild(btn);
  });
}

document.getElementById('bulkClear').addEventListener('click', () => {
  CASES.forEach(c => c.selected = false);
  render();
});

// ---- run pipeline simulation ----
const runBtn = document.getElementById('runBtn');
const statusPill = document.getElementById('statusPill');

function setStatus(text, cls){
  statusPill.textContent = text;
  statusPill.className = 'status-pill' + (cls ? ' ' + cls : '');
}

runBtn.addEventListener('click', () => {
  runBtn.disabled = true;
  const steps = [
    'Buscando en fuentes oficiales…',
    'Evaluando documentos nuevos…',
    'Escribiendo historia y capítulos…',
  ];
  let i = 0;
  setStatus(steps[i], 'working');
  const interval = setInterval(() => {
    i++;
    if (i < steps.length){
      setStatus(steps[i], 'working');
    } else {
      clearInterval(interval);
      CASES.unshift({
        id:'c' + Date.now(), new:true, approved:false, selected:false, previewOpen:false,
        title:'Transcripción de vuelo — Base Wright-Patterson',
        hook:'El controlador aéreo describió un objeto que "se detuvo en seco" a 9.000 metros de altitud.',
        agency:'Fuerza Aérea de EE. UU. — war.gov/UFO', docType:'Transcripción de radio', docDate:'04 nov 1971', caseNo:'DOW-1971-0087',
        chapters:1,
        previewText:'“Torre, tengo un contacto que no se mueve. Repito, está completamente detenido. Nunca vi algo así.”',
        tags:['#ovni','#nuevo','#audio'],
        networks:{tiktok:false, instagram:false, facebook:false, x:false}
      });
      setStatus('Listo — 1 caso nuevo para revisar', 'done');
      runBtn.disabled = false;
      render();
    }
  }, 900);
});

render();
</script>
