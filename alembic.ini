[alembic]
# Migrations for the editorial schema (Document/Story/Chapter/PlatformVersion/PublishRecord).
# Distinct from the ingestion pipeline's own SQLite file (data/knowledge_base/expedientes.sqlite),
# which is not managed by Alembic.
script_location = src/editorial/infrastructure/persistence/migrations

# Default location for local development. Overridden in tests via
# config.set_main_option("sqlalchemy.url", ...) against a temp file.
sqlalchemy.url = sqlite:///data/knowledge_base/editorial.sqlite

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
