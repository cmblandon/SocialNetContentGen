openapi: 3.0.0
info:
  title: Archivo Desclasificado — Editorial Service API
  description: |
    REST API for the editorial service defined in the archivo-desclasificado-pipeline
    OpenSpec change (openspec/changes/archivo-desclasificado-pipeline/). It sits on top
    of the local ingestion pipeline ("Proyecto Expediente") and exposes the
    human-approval gate, research trigger, publish records, and covered-cases
    management described in that change's specs/.

    Only the endpoints actually implemented so far are listed below. Do not add a path
    here until its implementing task in tasks.md is done — this file must always match
    what src/editorial/presentation/app.py actually serves, not what's merely planned.
    Planned-but-not-yet-implemented endpoints (for reference while building):
      - POST /cycles/{id}/approve, POST /cycles/{id}/reject   (Phase 3)
      - POST /research/run                                     (Phase 4)
      - GET /publish-records                                   (Phase 5)
      - GET /cases, PATCH /cases/{id}                           (Phase 6)
  version: 0.1.0
  contact:
    name: Archivo Desclasificado
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:8000
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      description: Confirms the editorial FastAPI service is up.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "ok"
      required:
        - status

tags:
  - name: System
    description: Service-level operational endpoints
